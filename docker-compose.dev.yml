# Local dependencies only — the app itself runs on the host via `npm run dev`,
# so a rebuild is not needed to see a change.
#
# Credentials and database names match server/.env.example. They are development
# values and belong in this file; nothing here is a secret.

services:
  mysql:
    image: mysql:8
    command:
      # utf8mb4 throughout: chat carries emoji, and utf8mb3 would truncate them.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: fs_internal_system
      MYSQL_USER: fs_app
      MYSQL_PASSWORD: fs_app_dev
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the test database and grants fs_app access to it. The image only
      # creates the one database in MYSQL_DATABASE, and `npm test` needs the other.
      - ./docs/dev/mysql-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: the cache layer no-ops unless MEMCACHED_SERVERS is set, so this is
  # only here for testing that path.
  memcached:
    image: memcached:1.6-alpine
    ports:
      - '11211:11211'

volumes:
  mysql-data:
